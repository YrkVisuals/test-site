name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Ces heures couvrent UTC+1 et UTC+2. Le contrôle ci-dessous ne déploie
    # qu'à 00:00 ou 12:00, heure Europe/Paris.
    - cron: '0 10,11,22,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  schedule-check:
    name: Vérifier l'heure de publication
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - name: Vérifier le déclencheur
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Europe/Paris date +%H)"
          if [ "$local_hour" = "00" ] || [ "$local_hour" = "12" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Publier le site
    needs: schedule-check
    if: needs.schedule-check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
